# Deploy to GitHub Pages (follows the Vite static-deploy guide).
# One-time setup: repo Settings -> Pages -> Source: "GitHub Actions".
# The build fails while any "TODO:" placeholder remains in src/data (validate:strict).
name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time; do not cancel a deployment that is already running.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # "/" for <user>.github.io or a custom domain. For a project site (repo "personal-website")
      # set this to "/personal-website/" and set site.siteUrl in src/data/site.json to match.
      BASE_PATH: /
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Validate content (strict, no placeholders)
        run: npm run validate:strict
      - name: Lint, test, validate, build, check size
        run: npm run ci
      - name: Set up Pages
        uses: actions/configure-pages@v6
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
